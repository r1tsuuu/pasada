<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Pasada: fuel aid that only buys fuel">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a33"/><stop offset=".55" stop-color="#1c2540"/><stop offset="1" stop-color="#2a2348"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4c430" stop-opacity=".42"/><stop offset=".55" stop-color="#f4c430" stop-opacity=".10"/><stop offset="1" stop-color="#f4c430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fe3b0" stop-opacity=".22"/><stop offset="1" stop-color="#6fe3b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <style>
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 640px 158px; }
      .road { animation: drive 2.4s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .75; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes drive { to { stroke-dashoffset: -150; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .road { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="380" fill="url(#sky)"/>
  <ellipse class="pulse" cx="640" cy="158" rx="520" ry="240" fill="url(#aura)"/>
  <ellipse cx="1120" cy="60" rx="300" ry="170" fill="url(#aura2)"/>
  <ellipse cx="130" cy="330" rx="280" ry="150" fill="url(#aura2)"/>
  <rect x="470" y="62" width="340" height="124" rx="20" fill="#f4c430" opacity=".55" filter="url(#soft)"/>
  <rect x="470" y="62" width="340" height="124" rx="20" fill="#f4c430"/>
  <text x="640" y="152" text-anchor="middle" font-family="Impact, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="3" fill="#1c2540">PASADA</text>
  <text x="640" y="238" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" fill="#ffffff">Fuel aid that only buys fuel</text>
  <text x="640" y="280" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c8cfdf">Every jeepney gets an AI agent that decides, pays and asks for money on its own</text>
  <line class="road" x1="-150" y1="334" x2="1430" y2="334" stroke="#f4c430" stroke-width="6" stroke-dasharray="90 60"/>
</svg>
